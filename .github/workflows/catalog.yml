name: Publish and update Lexi catalog
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'publish: existing catalog; verify: test model without adding words; update: prepare new packs'
        type: choice
        options: [publish, verify, update]
        default: publish
  schedule:
    - cron: '17 6 * * *' # About 09:17 Moscow; GitHub may delay scheduled runs.

concurrency:
  group: lexi-catalog
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  build:
    # Do not consume private-repository minutes or run a fork's unattended job.
    if: >-
      github.event.repository.private == false &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name != 'schedule' || vars.ENABLE_UPDATES == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install inspected public sources on first browser upload
        if: hashFiles('scripts/catalog.py') == ''
        run: |
          python - <<'PY'
          import hashlib, pathlib, zipfile
          archive = pathlib.Path('lexi-source.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '42367fb4ed4c0ec45cc34ce6d0cb18a5b4d76606a23406ccdc4c1f724bd0d259'
          roots = {'scripts', 'tests', 'data', 'docs'}
          files = {'README.md', '.gitignore', 'requirements.txt', 'runtime-lock.json', 'actions-lock.json'}
          with zipfile.ZipFile(archive) as bundle:
              for item in bundle.infolist():
                  path = pathlib.PurePosixPath(item.filename)
                  assert path.parts[0] == 'lexi-catalog' and '..' not in path.parts
                  relative = pathlib.Path(*path.parts[1:])
                  assert relative.parts[0] in roots or str(relative) in files
                  assert item.file_size < 8 * 1024 * 1024
                  relative.parent.mkdir(parents=True, exist_ok=True)
                  relative.write_bytes(bundle.read(item))
          PY
      - name: Install parser
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Test integrity and failure handling
        run: python -m unittest discover -s tests -v
      - name: Determine missing packs
        id: plan
        run: python scripts/update.py --plan
      - name: Start pinned free CPU model
        if: >-
          inputs.mode == 'verify' ||
          (steps.plan.outputs.needed == 'true' && (github.event_name == 'schedule' || inputs.mode == 'update'))
        run: python scripts/runtime.py
      - name: Verify real dictionary and model integration without publishing new words
        if: inputs.mode == 'verify'
        run: python scripts/smoke.py
      - name: Prepare new packs
        if: steps.plan.outputs.needed == 'true' && (github.event_name == 'schedule' || inputs.mode == 'update')
        run: python scripts/update.py
      - name: Build validated public snapshot
        run: python scripts/build.py
      - name: Check generated data
        run: python -m unittest discover -s tests -v
      - name: Save public catalog history
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/commit.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs
      - name: Stop model
        if: always()
        run: |
          if [ -f .runtime/server.pid ]; then
            kill "$(cat .runtime/server.pid)" || true
          fi

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
